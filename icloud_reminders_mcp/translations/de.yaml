configuration:
  apple_id:
    name: Apple Account E-Mail
    description: E-Mail-Adresse fuer die iCloud CalDAV Anmeldung.
  app_specific_password:
    name: App-spezifisches Passwort
    description: App-spezifisches Apple Passwort. Niemals das normale Apple Account Passwort verwenden.
  allow_delete:
    name: Loeschen erlauben
    description: Aktiviert das destruktive delete_reminder Tool. Die Upstream-Bestaetigung bleibt pro Aufruf erforderlich.
  list_allowlist:
    name: Erlaubte Erinnerungslisten
    description: Optional komma-getrennte Listennamen. Leer erlaubt alle VTODO-faehigen Listen.
  request_timeout:
    name: iCloud Timeout
    description: Timeout in Sekunden fuer CalDAV Anfragen.
  mcp_auth_token:
    name: Lokaler MCP Bearer Token
    description: Zufallstoken nur zwischen Tunnel und internem MCP Endpunkt.
