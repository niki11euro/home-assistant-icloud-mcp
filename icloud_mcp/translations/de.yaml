configuration:
  apple_id:
    name: Apple Account E-Mail
    description: E-Mail-Adresse fuer die iCloud CalDAV/CardDAV Anmeldung.
  app_specific_password:
    name: App-spezifisches Passwort
    description: App-spezifisches Apple Passwort. Niemals das normale Apple Account Passwort verwenden.
  timezone:
    name: Zeitzone
    description: IANA Zeitzone fuer Kalenderwerte ohne expliziten Offset.
  calendar_read:
    name: Kalender lesen
    description: Erlaubt das Anzeigen und Suchen von Kalendern und Terminen.
  calendar_write:
    name: Kalender schreiben
    description: Erlaubt das Erstellen, Bearbeiten und Loeschen von Terminen.
  contacts_read:
    name: Kontakte lesen
    description: Erlaubt das Anzeigen und Suchen von Kontakten.
  contacts_write:
    name: Kontakte schreiben
    description: Erlaubt das Erstellen, Bearbeiten und Loeschen von Kontakten.
  enable_mail:
    name: Mail aktivieren
    description: Aktiviert lesenden Zugriff auf iCloud Mail.
  mail_address:
    name: Mailadresse
    description: Optional. Leer lassen, um die Apple Account E-Mail zu verwenden.
  enable_mail_write:
    name: Mail-Aenderungen aktivieren
    description: Aktiviert Flags, Verschieben und Papierkorb. Mail muss aktiviert sein.
  enable_mail_send:
    name: Mailversand aktivieren
    description: Aktiviert SMTP Versand. Eine Empfaengerfreigabe ist erforderlich.
  smtp_allowed_recipients:
    name: Erlaubte Mail-Empfaenger
    description: Exakte, komma-getrennte Adressen, an die send_message senden darf.
  mcp_auth_token:
    name: Lokaler MCP Bearer Token
    description: Zufallstoken nur zwischen Tunnel und internem MCP Endpunkt.
