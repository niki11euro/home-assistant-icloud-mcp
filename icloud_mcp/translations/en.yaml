configuration:
  apple_id:
    name: Apple Account email
    description: Email address used for iCloud CalDAV/CardDAV authentication.
  app_specific_password:
    name: App-specific password
    description: Apple app-specific password. Never use the main Apple Account password.
  timezone:
    name: Time zone
    description: IANA time zone used for calendar values without an explicit offset.
  calendar_read:
    name: Read calendars
    description: Allow listing and searching calendars and events.
  calendar_write:
    name: Write calendars
    description: Allow creating, updating and deleting calendar events.
  contacts_read:
    name: Read contacts
    description: Allow listing and searching address books and contacts.
  contacts_write:
    name: Write contacts
    description: Allow creating, updating and deleting contacts.
  enable_mail:
    name: Enable Mail
    description: Enable iCloud Mail read tools.
  mail_address:
    name: Mail address
    description: Optional mailbox address. Leave empty to use the Apple Account email.
  enable_mail_write:
    name: Enable Mail mutations
    description: Enable mail flags, move and trash tools. Requires Mail enabled.
  enable_mail_send:
    name: Enable Mail send
    description: Enable SMTP send. Requires an allowed-recipient policy.
  smtp_allowed_recipients:
    name: Allowed SMTP recipients
    description: Exact comma-separated addresses allowed for send_message.
  mcp_auth_token:
    name: Local MCP bearer token
    description: Random token used only between the tunnel and this internal MCP endpoint.
